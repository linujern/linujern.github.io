<!--
  Daybreak — a gentle daily dashboard
  Single file. Serve as index.html via Cloudflare Pages (built from your GitHub repo).
  Access control is handled at the edge by Cloudflare Access (Google / one-time-PIN login),
  so there is no password logic in this file. The page is open once you are past the Access gate.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daybreak</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --r:28px; --r-sm:18px;
    --shadow:0 18px 50px -22px rgba(40,30,70,.45), 0 4px 14px -8px rgba(40,30,70,.25);
    --glass:rgba(255,255,255,.42); --glass-2:rgba(255,255,255,.62);
    --stroke:rgba(255,255,255,.7); --ink:#3a2f52; --ink-soft:#6a5f82; --accent:#c6608f;
    --c1:#ffd9c0; --c2:#ffc3d8; --c3:#d9c7ff; --c4:#bfe0ff; --sun:rgba(255,238,200,.9);
  }
  html[data-theme="dawn"]{--c1:#ffe2c9;--c2:#ffc6da;--c3:#dcc8ff;--c4:#cfe5ff;--ink:#4a3658;--ink-soft:#7a6a8e;--accent:#d56a93;--sun:rgba(255,236,196,.95);}
  html[data-theme="day"]{--c1:#d7ecff;--c2:#eafff2;--c3:#fff4d6;--c4:#ffe4ee;--ink:#2f4a5c;--ink-soft:#5e7686;--accent:#3d9fb0;--sun:rgba(255,245,210,.95);}
  html[data-theme="dusk"]{--c1:#ffd0a8;--c2:#ff9fc0;--c3:#c79be0;--c4:#8f8fd6;--ink:#42284e;--ink-soft:#6e5374;--accent:#e0698f;--sun:rgba(255,210,170,.9);}
  html[data-theme="night"]{--c1:#22244e;--c2:#2c2b58;--c3:#3a2f6b;--c4:#1c2350;--ink:#eef0ff;--ink-soft:#b9bce0;--accent:#b7a3ff;--glass:rgba(40,40,80,.42);--glass-2:rgba(50,50,95,.55);--stroke:rgba(180,180,230,.3);--sun:rgba(220,225,255,.55);}

  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:"Quicksand",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 800px at 12% -8%, var(--c1), transparent 60%),
      radial-gradient(1100px 760px at 92% 4%, var(--c2), transparent 58%),
      radial-gradient(1000px 900px at 78% 100%, var(--c3), transparent 60%),
      radial-gradient(1000px 900px at 8% 96%, var(--c4), transparent 60%), var(--c2);
    background-attachment:fixed; overflow-x:hidden; transition:color .8s ease; -webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;}
  .glow{position:fixed;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle at center, var(--sun), transparent 65%);filter:blur(8px);z-index:0;pointer-events:none;transition:background .8s ease;}
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .spark{position:absolute;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 8px rgba(255,255,255,.9);
    animation:twinkle var(--d,6s) ease-in-out infinite, drift var(--df,22s) linear infinite;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6);}50%{opacity:.85;transform:scale(1);}}
  @keyframes drift{from{transform:translateY(0);}to{transform:translateY(-40px);}}

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:34px 22px 80px;}

  /* ---------- calendar leaf ---------- */
  .leaf-zone{display:flex;justify-content:center;margin-bottom:6px;}
  .leaf{width:118px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
    border:1px solid var(--stroke);background:var(--glass-2);backdrop-filter:blur(10px);
    transform:rotate(-2deg);animation:float 6s ease-in-out infinite;}
  .leaf .band{background:var(--accent);color:#fff;text-align:center;padding:9px 0 7px;position:relative;
    font-weight:700;letter-spacing:3px;font-size:13px;text-transform:uppercase;}
  .leaf .band::before,.leaf .band::after{content:"";position:absolute;top:3px;width:8px;height:8px;border-radius:50%;
    background:var(--glass-2);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);}
  .leaf .band::before{left:26px;} .leaf .band::after{right:26px;}
  .leaf .num{font-family:"Fraunces",serif;font-weight:500;font-size:56px;line-height:1;text-align:center;padding:10px 0 2px;color:var(--ink);}
  .leaf .dow{text-align:center;color:var(--ink-soft);font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;padding-bottom:12px;}

  header{text-align:center;padding:6px 0 4px;}
  .clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(34px,7vw,60px);letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.35);}
  .clock .ampm{font-size:.4em;vertical-align:super;margin-left:6px;color:var(--ink-soft);font-weight:600;}
  .date{color:var(--ink-soft);font-weight:600;letter-spacing:.6px;margin-top:2px;text-transform:uppercase;font-size:13px;}
  .greet{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:clamp(28px,6vw,48px);margin:12px 0 2px;line-height:1.05;}
  .greet .name{font-style:italic;color:var(--accent);cursor:text;border-bottom:2px dashed transparent;transition:border-color .25s;}
  .greet .name:hover{border-color:var(--accent);}

  /* ---------- week strip ---------- */
  .week{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px auto 4px;max-width:560px;}
  .week .wk-label{font-weight:700;color:var(--ink-soft);letter-spacing:1px;font-size:12px;text-transform:uppercase;}
  .week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;}
  .week .day{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:9px 0 8px;text-align:center;
    backdrop-filter:blur(8px);transition:transform .2s;}
  .week .day:hover{transform:translateY(-2px);}
  .week .day .dl{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;}
  .week .day .dn{font-weight:700;font-size:18px;margin-top:2px;}
  .week .day.today{background:var(--accent);border-color:transparent;box-shadow:0 8px 22px -10px var(--accent);}
  .week .day.today .dl,.week .day.today .dn{color:#fff;}

  .buddy-zone{display:flex;justify-content:center;margin:18px 0 22px;}
  .buddy{width:140px;height:140px;cursor:pointer;animation:float 5.5s ease-in-out infinite;transform-origin:center bottom;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-12px) rotate(1deg);}}
  .buddy.hop{animation:hop .55s cubic-bezier(.3,1.4,.5,1);}
  @keyframes hop{0%{transform:translateY(0) scale(1);}35%{transform:translateY(-30px) scale(1.06,.94);}70%{transform:translateY(0) scale(.96,1.05);}100%{transform:translateY(0) scale(1);}}
  .buddy .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
  .bubble{position:relative;margin:-6px auto 0;max-width:300px;background:var(--glass-2);border:1px solid var(--stroke);
    backdrop-filter:blur(10px);padding:10px 16px;border-radius:18px;text-align:center;font-weight:600;color:var(--ink);
    box-shadow:var(--shadow);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .35s ease, transform .35s ease;}
  .bubble.show{opacity:1;transform:translateY(0) scale(1);}
  .bubble::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:var(--glass-2);border-left:1px solid var(--stroke);border-top:1px solid var(--stroke);}

  .grid{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;margin-top:8px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:20px;}
  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(16px);
    box-shadow:var(--shadow);padding:22px;transition:transform .3s ease, box-shadow .3s ease;opacity:0;transform:translateY(16px);animation:rise .7s ease forwards;}
  .card:hover{transform:translateY(-3px);box-shadow:0 26px 60px -24px rgba(40,30,70,.5);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}
  .card h2{font-family:"Fraunces",serif;font-weight:500;font-size:19px;margin:0 0 14px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{margin-left:auto;font-family:"Quicksand";font-size:12px;font-weight:600;color:var(--ink-soft);
    background:rgba(255,255,255,.35);padding:3px 10px;border-radius:999px;border:1px solid var(--stroke);cursor:pointer;}
  .card h2 .tag:hover{color:var(--accent);}

  .wx-main{display:flex;align-items:center;gap:16px;}
  .wx-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));}
  .wx-temp{font-size:46px;font-weight:700;line-height:1;}
  .wx-temp small{font-size:18px;font-weight:600;color:var(--ink-soft);vertical-align:super;cursor:pointer;}
  .wx-place{font-weight:600;color:var(--ink-soft);margin-top:2px;}
  .wx-place input{all:unset;font:inherit;color:var(--accent);border-bottom:1px dashed var(--accent);min-width:60px;}
  .wx-desc{margin-top:12px;font-weight:500;}
  .wx-comment{margin-top:8px;font-style:italic;font-family:"Fraunces",serif;color:var(--ink-soft);}
  .wx-row{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .wx-row b{color:var(--ink);font-weight:700;}

  .breathe{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4px;}
  .orb{width:120px;height:120px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), var(--accent) 80%);
    box-shadow:0 0 40px -6px var(--accent);transition:transform 4s ease-in-out, box-shadow 4s ease-in-out;}
  .orb.in{transform:scale(1.5);box-shadow:0 0 70px 4px var(--accent);}
  .orb.hold{transform:scale(1.5);}
  .orb.out{transform:scale(.85);box-shadow:0 0 24px -8px var(--accent);}
  .breathe .phase{font-family:"Fraunces",serif;font-style:italic;font-size:20px;min-height:26px;}
  .btn{all:unset;cursor:pointer;font-weight:700;padding:9px 20px;border-radius:999px;background:var(--accent);color:#fff;box-shadow:var(--shadow);transition:filter .2s, transform .15s;}
  .btn:hover{filter:brightness(1.06);}.btn:active{transform:scale(.96);}
  .btn.ghost{background:rgba(255,255,255,.4);color:var(--ink);border:1px solid var(--stroke);}

  .news-list{display:flex;flex-direction:column;}
  .news-item{padding:13px 2px;border-bottom:1px dashed var(--stroke);}
  .news-item:last-child{border-bottom:0;}
  .news-item a,.news-item .title{font-weight:700;color:var(--ink);text-decoration:none;display:block;line-height:1.35;}
  .news-item a:hover{color:var(--accent);}
  .news-item .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .news-item .meta .src{color:var(--accent);font-weight:700;}
  .topics-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .topics-row input{all:unset;flex:1;min-width:120px;font:inherit;color:var(--ink);background:rgba(255,255,255,.35);border:1px solid var(--stroke);border-radius:999px;padding:6px 14px;}
  .skeleton{height:14px;border-radius:8px;background:linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.6), rgba(255,255,255,.25));background-size:200% 100%;animation:shimmer 1.4s infinite;margin:10px 0;}
  .skeleton.short{width:55%;}.skeleton.med{width:80%;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .muted{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}

  .intent.card{margin-top:20px;}
  .intent-row{display:flex;align-items:center;gap:12px;}
  .intent-row .lead{font-family:"Fraunces",serif;font-style:italic;font-size:20px;white-space:nowrap;}
  .intent-row input{all:unset;flex:1;font:inherit;font-weight:600;color:var(--ink);border-bottom:2px dashed var(--stroke);padding:6px 2px;}
  .intent-row input::placeholder{color:var(--ink-soft);opacity:.7;}
  .intent-row .check{font-size:22px;opacity:0;transition:opacity .3s, transform .3s;transform:scale(.6);}
  .intent-row .check.on{opacity:1;transform:scale(1);}

  footer{text-align:center;margin-top:34px;color:var(--ink-soft);font-size:12.5px;opacity:.8;}
  a.subtle{color:var(--accent);text-decoration:none;}
</style>

<div class="glow"></div>
<div class="sky" id="sky"></div>

<div id="app">
  <div class="wrap">
    <div class="leaf-zone">
      <div class="leaf">
        <div class="band" id="leafMonth">— —</div>
        <div class="num" id="leafDay">·</div>
        <div class="dow" id="leafDow">—</div>
      </div>
    </div>

    <header>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="greet" id="greet">Hello, <span class="name" id="name" title="click to rename">friend</span></div>
    </header>

    <div class="week">
      <div class="wk-label" id="wkLabel">Week —</div>
      <div class="days" id="weekDays"></div>
    </div>

    <div class="buddy-zone">
      <div style="text-align:center">
        <svg class="buddy" id="buddy" viewBox="0 0 200 200" aria-label="your companion">
          <defs><radialGradient id="bg" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffe7f1"/><stop offset="100%" stop-color="#ffc6e0"/>
          </radialGradient></defs>
          <g fill="#fff" opacity=".9">
            <path d="M40 44 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
            <path d="M162 60 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
            <circle cx="150" cy="130" r="3"/><circle cx="46" cy="120" r="2.5"/>
          </g>
          <path d="M58 64 q-10 -34 16 -40 q4 22 -2 38 z" fill="url(#bg)" stroke="#ffb3d3" stroke-width="2"/>
          <path d="M142 64 q10 -34 -16 -40 q-4 22 2 38 z" fill="url(#bg)" stroke="#ffb3d3" stroke-width="2"/>
          <ellipse cx="100" cy="116" rx="58" ry="54" fill="url(#bg)" stroke="#ffb3d3" stroke-width="2.5"/>
          <circle cx="68" cy="124" r="11" fill="#ff9fc4" opacity=".55"/><circle cx="132" cy="124" r="11" fill="#ff9fc4" opacity=".55"/>
          <ellipse class="eye" cx="82" cy="108" rx="6" ry="9" fill="#4a3658"/><ellipse class="eye" cx="118" cy="108" rx="6" ry="9" fill="#4a3658"/>
          <circle cx="84" cy="104" r="2" fill="#fff"/><circle cx="120" cy="104" r="2" fill="#fff"/>
          <path d="M92 124 q8 8 16 0" fill="none" stroke="#4a3658" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="bubble" id="bubble"></div>
      </div>
    </div>

    <div class="grid">
      <div class="stack">
        <section class="card d1">
          <h2>🌤️ Weather <span class="tag" id="wxRefresh">refresh</span></h2>
          <div id="wxBody"><div class="skeleton med"></div><div class="skeleton short"></div></div>
        </section>
        <section class="card d3">
          <h2>🫧 A moment to breathe</h2>
          <div class="breathe">
            <div class="orb" id="orb"></div>
            <div class="phase" id="phase">whenever you're ready</div>
            <button class="btn" id="breatheBtn">Begin</button>
          </div>
        </section>
      </div>
      <div class="stack">
        <section class="card d2">
          <h2>📰 Headlines <span class="tag" id="newsRefresh">refresh</span></h2>
          <div class="topics-row">
            <span class="muted" style="font-weight:600">topics</span>
            <input id="topics" placeholder="world, technology, science, good news" />
          </div>
          <div class="topics-row">
            <span class="muted" style="font-weight:600">show</span>
            <input id="count" type="number" min="1" max="25" inputmode="numeric" style="flex:0 0 70px;text-align:center" />
            <span class="muted" style="font-weight:600">headlines</span>
          </div>
          <div class="news-list" id="newsBody">
            <div class="skeleton med"></div><div class="skeleton short"></div>
            <div class="skeleton med"></div><div class="skeleton short"></div>
          </div>
        </section>
      </div>
    </div>

    <section class="card intent d4">
      <div class="intent-row">
        <span class="lead">Today, I'd like to</span>
        <input id="intent" placeholder="something small and kind to myself…" />
        <span class="check" id="intentCheck">✓</span>
      </div>
    </section>

    <footer>Daybreak · weather by Open-Meteo · headlines via Google News · <span id="connNote"></span></footer>
  </div>
</div>

<script>
/* ============ STORAGE (localStorage first, then Claude storage, then memory) ============ */
const mem={};
function lget(k){ try{ const v=localStorage.getItem(k); return v; }catch(e){ return null; } }
function lset(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
async function sget(k){ k='db_'+k; const v=lget(k); if(v!==null) return v;
  try{ if(window.storage){ const r=await window.storage.get(k,false); return r?r.value:null; } }catch(e){} return (k in mem)?mem[k]:null; }
async function sset(k,v){ k='db_'+k; v=String(v); if(lset(k,v)) return;
  try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){} mem[k]=v; }

/* ============ boot ============ */
let booted=false;
function boot(){
  if(booted) return; booted=true;

  /* clock + theme + leaf */
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dows=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function themeFor(h){ if(h>=5&&h<9)return"dawn"; if(h>=9&&h<17)return"day"; if(h>=17&&h<21)return"dusk"; return"night"; }
  function greetFor(h){ if(h>=5&&h<12)return"Good morning"; if(h>=12&&h<17)return"Good afternoon"; if(h>=17&&h<22)return"Good evening"; return"Still up"; }
  const clockEl=document.getElementById('clock'); let showSecs=false;
  function tick(){
    const d=new Date(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
    document.documentElement.dataset.theme=themeFor(h);
    const hh=String(h).padStart(2,'0'), mm=String(m).padStart(2,'0');
    clockEl.textContent = showSecs ? hh+':'+mm+':'+String(s).padStart(2,'0') : hh+':'+mm;
    document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('greet').firstChild.textContent=greetFor(h)+', ';
    document.getElementById('leafMonth').textContent=months[d.getMonth()];
    document.getElementById('leafDay').textContent=d.getDate();
    document.getElementById('leafDow').textContent=dows[d.getDay()];
  }
  tick(); setInterval(tick,1000);
  clockEl.title='hover for seconds';
  clockEl.addEventListener('mouseenter',()=>{ showSecs=true; tick(); });
  clockEl.addEventListener('mouseleave',()=>{ showSecs=false; tick(); });

  /* current week strip + ISO week number */
  function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
    const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
    return Math.ceil((((t-ys)/864e5)+1)/7); }
  (function buildWeek(){
    const now=new Date(); const dow=now.getDay(); const mondayOffset=(dow===0?-6:1)-dow;
    const monday=new Date(now); monday.setDate(now.getDate()+mondayOffset);
    const L=['MON','TUE','WED','THU','FRI','SAT','SUN'];
    let html='';
    for(let i=0;i<7;i++){ const c=new Date(monday); c.setDate(monday.getDate()+i);
      const isToday=c.toDateString()===now.toDateString();
      html+=`<div class="day${isToday?' today':''}"><div class="dl">${L[i]}</div><div class="dn">${c.getDate()}</div></div>`; }
    document.getElementById('weekDays').innerHTML=html;
    document.getElementById('wkLabel').textContent='Week '+isoWeek(now)+' · '+now.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  })();

  /* sparkles */
  (function(){ const sky=document.getElementById('sky');
    for(let i=0;i<26;i++){ const s=document.createElement('div'); s.className='spark';
      const sz=Math.random()*2.4+1; s.style.width=s.style.height=sz+'px';
      s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
      s.style.setProperty('--d',(Math.random()*5+4)+'s'); s.style.setProperty('--df',(Math.random()*18+14)+'s');
      s.style.animationDelay=(-Math.random()*6)+'s, '+(-Math.random()*20)+'s'; sky.appendChild(s); } })();

  /* name */
  const nameEl=document.getElementById('name');
  (async()=>{ const nm=await sget('name'); if(nm) nameEl.textContent=nm; })();
  nameEl.addEventListener('click',()=>{ nameEl.contentEditable=true; nameEl.focus(); document.getSelection().selectAllChildren(nameEl); });
  nameEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nameEl.blur(); }});
  nameEl.addEventListener('blur',async()=>{ nameEl.contentEditable=false;
    let v=nameEl.textContent.replace(/\s+/g,' ').trim().slice(0,24)||'friend'; nameEl.textContent=v;
    await sset('name',v); popBuddy("Lovely to see you, "+v+" ♥"); });

  /* companion */
  const lines=["You don't have to do it all today.","One small thing, then another.","You showed up. That counts.",
    "Soft start, steady day.","Be gentle with yourself today.","The day is yours.","Tiny progress is still progress.",
    "Drink some water, you wonderful thing.","Whatever happens, you'll handle it.","I'm glad you're here."];
  const buddy=document.getElementById('buddy'), bubble=document.getElementById('bubble'); let bTimer;
  window.popBuddy=function(txt){ bubble.textContent=txt||lines[Math.floor(Math.random()*lines.length)];
    bubble.classList.add('show'); buddy.classList.remove('hop'); void buddy.offsetWidth; buddy.classList.add('hop');
    clearTimeout(bTimer); bTimer=setTimeout(()=>bubble.classList.remove('show'),4200); };
  buddy.addEventListener('click',()=>popBuddy());
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  setTimeout(()=>popBuddy(lines[doy%lines.length]),900);

  /* breathing */
  const orb=document.getElementById('orb'), phase=document.getElementById('phase'), bBtn=document.getElementById('breatheBtn');
  let breathing=false;
  function cycle(){ if(!breathing)return; phase.textContent='Breathe in…'; orb.className='orb in';
    setTimeout(()=>{ if(!breathing)return; phase.textContent='Hold…'; orb.className='orb hold'; },4000);
    setTimeout(()=>{ if(!breathing)return; phase.textContent='And out…'; orb.className='orb out'; },6000);
    setTimeout(()=>{ if(!breathing)return; cycle(); },10000); }
  bBtn.addEventListener('click',()=>{ breathing=!breathing;
    if(breathing){ bBtn.textContent='Stop'; bBtn.classList.add('ghost'); cycle(); }
    else{ bBtn.textContent='Begin'; bBtn.classList.remove('ghost'); orb.className='orb'; phase.textContent="whenever you're ready"; } });

  /* intention */
  const intent=document.getElementById('intent'), intentCheck=document.getElementById('intentCheck');
  const todayKey='intent:'+new Date().toISOString().slice(0,10);
  (async()=>{ const v=await sget(todayKey); if(v){ intent.value=v; intentCheck.classList.add('on'); }})();
  let iTimer; intent.addEventListener('input',()=>{ clearTimeout(iTimer);
    iTimer=setTimeout(async()=>{ await sset(todayKey,intent.value); intentCheck.classList.toggle('on',intent.value.trim().length>0); },400); });

  /* weather */
  const WMO={0:['☀️','Clear skies'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Foggy'],48:['🌫️','Rime fog'],
    51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],
    61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],
    71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Light showers'],81:['🌦️','Showers'],
    82:['🌧️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Storm + hail'],99:['⛈️','Storm + hail']};
  let units='c', place='your sky', lastWx=null, lastCoords=null;
  function comfort(code,t){ if([95,96,99].includes(code))return"Storms about. A good day to stay cozy inside.";
    if([61,63,65,80,81,82,51,53,55].includes(code))return"A little rain. Maybe tuck an umbrella in your bag.";
    if([71,73,75,77,85,86].includes(code))return"Snow is falling softly. Warm socks today.";
    if([45,48].includes(code))return"Misty out. Take it slowly.";
    const tc=units==='c'?t:(t-32)*5/9;
    if(tc<3)return"Quite cold. Bundle up before you head out."; if(tc<12)return"A touch crisp. A cozy layer would be kind.";
    if(tc<24)return"Gentle and mild. Lovely for a slow walk."; return"Warm and bright. Keep some water close."; }
  async function fetchWeather(lat,lon,label){ const u=units==='f'?'fahrenheit':'celsius';
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&temperature_unit=${u}&wind_speed_unit=kmh`;
    const r=await fetch(url); if(!r.ok) throw new Error('wx'); lastWx=await r.json(); if(label) place=label; renderWeather(); }
  function renderWeather(){ if(!lastWx)return; const c=lastWx.current, code=c.weather_code, ic=WMO[code]||['🌡️','—'];
    const unit=units==='c'?'°C':'°F', hi=Math.round(lastWx.daily.temperature_2m_max[0]), lo=Math.round(lastWx.daily.temperature_2m_min[0]);
    document.getElementById('wxBody').innerHTML=`
      <div class="wx-main"><div class="wx-emoji">${ic[0]}</div>
        <div><div class="wx-temp">${Math.round(c.temperature_2m)}<small id="unitToggle" title="switch units">${unit}</small></div>
          <div class="wx-place">in <input id="cityInput" value="${place}" /></div></div></div>
      <div class="wx-desc">${ic[1]} · feels like ${Math.round(c.apparent_temperature)}°</div>
      <div class="wx-comment">${comfort(code,c.temperature_2m)}</div>
      <div class="wx-row"><span>High <b>${hi}°</b></span><span>Low <b>${lo}°</b></span>
        <span>Humidity <b>${c.relative_humidity_2m}%</b></span><span>Wind <b>${Math.round(c.wind_speed_10m)} km/h</b></span></div>`;
    document.getElementById('unitToggle').onclick=async()=>{ units=units==='c'?'f':'c'; await sset('units',units); if(lastCoords) fetchWeather(lastCoords[0],lastCoords[1]); };
    const ci=document.getElementById('cityInput');
    ci.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); changeCity(ci.value); }});
    ci.addEventListener('blur',()=>{ if(ci.value.trim()&&ci.value.trim()!==place) changeCity(ci.value); }); }
  async function changeCity(q){ q=q.trim(); if(!q)return;
    try{ const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q));
      const d=await r.json(); if(!d.results||!d.results.length){ popBuddy("I couldn't find that place. Try another?"); return; }
      const g=d.results[0]; lastCoords=[g.latitude,g.longitude]; await sset('city',g.name);
      fetchWeather(g.latitude,g.longitude,g.name+(g.country_code?', '+g.country_code:'')); }
    catch(e){ popBuddy("Trouble reaching the weather just now."); } }
  (async()=>{ units=(await sget('units'))||'c'; const savedCity=await sget('city');
    if(savedCity){ changeCity(savedCity); return; }
    if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(
      p=>{ lastCoords=[p.coords.latitude,p.coords.longitude]; fetchWeather(p.coords.latitude,p.coords.longitude,'your location'); },
      ()=>{ lastCoords=[59.42,17.83]; fetchWeather(59.42,17.83,'Stockholm, SE'); },{timeout:6000}); }
    else{ lastCoords=[59.42,17.83]; fetchWeather(59.42,17.83,'Stockholm, SE'); } })();
  document.getElementById('wxRefresh').onclick=()=>{ if(lastCoords) fetchWeather(lastCoords[0],lastCoords[1]); };

  /* news — key-free via Google News RSS through a public CORS proxy */
  const newsBody=document.getElementById('newsBody'), topicsInput=document.getElementById('topics'), countInput=document.getElementById('count');
  const DEFAULT_TOPICS='world, technology, science, good news', DEFAULT_COUNT=6;
  function getCount(){ let n=parseInt(countInput.value,10); if(isNaN(n)) n=DEFAULT_COUNT; return Math.max(1,Math.min(25,n)); }
  function skel(n){ let h=''; for(let i=0;i<n;i++) h+='<div class="skeleton med"></div><div class="skeleton short"></div>'; newsBody.innerHTML=h; }
  function render(items, requested){
    if(!items.length){ newsBody.innerHTML='<p class="muted">No headlines came through this time. <a class="subtle" href="#" id="rn">Try again</a></p>'; document.getElementById('rn').onclick=e=>{e.preventDefault();loadNews();}; return; }
    let html=items.map(it=>{ const t=(it.title||'').replace(/</g,'&lt;'), s=(it.source||'').replace(/</g,'&lt;');
      const head=it.url?`<a href="${it.url}" target="_blank" rel="noopener">${t}</a>`:`<span class="title">${t}</span>`;
      return `<div class="news-item">${head}<div class="meta"><span class="src">${s}</span></div></div>`; }).join('');
    if(items.length<requested) html+=`<p class="muted" style="margin-top:10px">That's all I could find for these topics — ${items.length} of the ${requested} you hoped for.</p>`;
    newsBody.innerHTML=html;
  }
  async function loadNews(){ const requested=getCount(); skel(Math.min(requested,6));
    const topics=(topicsInput.value.trim()||DEFAULT_TOPICS); await sset('topics',topics); await sset('count',requested);
    const q=topics.split(',').map(t=>t.trim()).filter(Boolean).join(' OR ');
    const feed='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en';
    const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(feed);
    try{ const r=await fetch(proxy); if(!r.ok) throw new Error('proxy'); const text=await r.text();
      const xml=new DOMParser().parseFromString(text,'text/xml');
      const items=[...xml.querySelectorAll('item')].slice(0,requested).map(it=>{ let title=it.querySelector('title')?.textContent||'';
        const url=it.querySelector('link')?.textContent||''; let source=it.querySelector('source')?.textContent||'';
        if(!source){ const m=title.match(/\s-\s([^-]+)$/); if(m){ source=m[1].trim(); title=title.slice(0,m.index).trim(); } }
        return {title,source,url}; });
      render(items, requested); document.getElementById('connNote').textContent=''; }
    catch(e){ newsBody.innerHTML='<p class="muted">Headlines are napping just now (the news source is unreachable). The rest of your day is here for you. <a class="subtle" href="#" id="rn">Try again</a></p>';
      const rn=document.getElementById('rn'); if(rn) rn.onclick=ev=>{ev.preventDefault();loadNews();}; } }
  (async()=>{ const t=await sget('topics'); topicsInput.value=t||DEFAULT_TOPICS; const c=await sget('count'); countInput.value=c||DEFAULT_COUNT; loadNews(); })();
  document.getElementById('newsRefresh').onclick=loadNews;
  topicsInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); topicsInput.blur(); loadNews(); }});
  countInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); countInput.blur(); loadNews(); }});
  countInput.addEventListener('change',loadNews);
}
boot();
</script>
